<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="OPENCLAW: A 24/7 copilot that watches your commits and reports back.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070b"/><stop offset="1" stop-color="#11121c"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b" stop-opacity="0"/><stop offset=".5" stop-color="#f59e0b" stop-opacity=".9"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></linearGradient>
    <radialGradient id="ga"><stop offset="0" stop-color="#f59e0b" stop-opacity=".42"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb"><stop offset="0" stop-color="#ef4444" stop-opacity=".34"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect width="1280" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif}
    .mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace}
    .spin{animation:spin linear infinite}.rev{animation-direction:reverse}
    .orb{animation:drift 16s ease-in-out infinite alternate}.orb2{animation:drift2 20s ease-in-out infinite alternate}
    .scan{animation:scan 7s linear infinite}.blink{animation:blink 1.1s steps(1) infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes drift{to{transform:translate(140px,40px)}}
    @keyframes drift2{to{transform:translate(-160px,-30px)}}
    @keyframes scan{from{transform:translateX(-500px)}to{transform:translateX(1500px)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <circle class="orb" cx="260" cy="40" r="300" fill="url(#ga)"/>
    <circle class="orb2" cx="1050" cy="320" r="320" fill="url(#gb)"/>
    <g class="spin" style="transform-origin:1085px 196px;animation-duration:28s"><polygon points="1085.0,100.0 1176.3,166.3 1141.4,273.7 1028.6,273.7 993.7,166.3" fill="none" stroke="url(#acc)" stroke-width="2" stroke-opacity="0.9"/></g>
    <g class="spin rev" style="transform-origin:1085px 196px;animation-duration:38s"><polygon points="1109.0,130.2 1155.0,198.5 1104.2,263.3 1026.9,235.1 1029.9,152.9" fill="none" stroke="url(#acc)" stroke-width="1.25" stroke-opacity="0.68"/></g>
    <g class="spin" style="transform-origin:1085px 196px;animation-duration:48s"><polygon points="1113.3,162.3 1125.8,212.6 1081.8,239.9 1042.3,206.6 1061.8,158.6" fill="none" stroke="url(#acc)" stroke-width="1.25" stroke-opacity="0.46"/></g>
    <circle cx="1085" cy="196" r="5" fill="#f59e0b"/>
    <text x="64" y="70" class="mono" font-size="14" letter-spacing="3" fill="#f59e0b">◆ F0RGER123 / wholescaleos-openclaw</text>
    <text x="1216" y="70" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#9a9aa8">PUBLIC · MIT</text>
    <text x="64" y="174.56" class="sans" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#ttl)">OPENCLAW</text>
    <text x="64" y="216.56" class="mono" font-size="19" fill="#c9c9d6">A 24/7 copilot that watches your commits and reports back.<tspan class="blink" fill="#f59e0b"> ▍</tspan></text>
    <g transform="translate(64,262)"><rect width="80" height="30" rx="15" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".45"/><text x="40" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">Python</text></g>
    <g transform="translate(154,262)"><rect width="80" height="30" rx="15" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".45"/><text x="40" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">Gemini</text></g>
    <g transform="translate(244,262)"><rect width="80" height="30" rx="15" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".45"/><text x="40" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">Resend</text></g>
    <g transform="translate(334,262)"><rect width="105" height="30" rx="15" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".45"/><text x="52.5" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">Cloud Run</text></g>
    <text x="1216" y="306" text-anchor="end" class="mono" font-size="12" letter-spacing="3" fill="#6e6e7c">OC-24/7</text>
    <rect class="scan" x="0" y="337" width="420" height="3" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="339" rx="20" fill="none" stroke="url(#acc)" stroke-opacity=".35"/>
</svg>
